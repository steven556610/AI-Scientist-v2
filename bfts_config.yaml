# path to the task data directory
data_dir: "data"
preprocess_data: False

goal: null
eval: null

log_dir: logs
workspace_dir: workspaces

# whether to copy the data to the workspace directory (otherwise it will be symlinked)
# copying is recommended to prevent the agent from accidentally modifying the original data
copy_data: True

exp_name: run # a random experiment name will be generated if not provided

# settings for code execution
exec:
  # The idea's grid is 48 merge+evaluate configurations of a 5B model, and the
  # guided MoE cells cost ~300 s each. That does not fit in an hour, and the
  # agent's response to the squeeze was to delete a level of the grid twice --
  # first dare_ties, then MoE entirely -- which is the one trade the plan
  # forbids. Give the sweep room to be run in full instead.
  timeout: 10800
  agent_file_name: runfile.py
  format_tb_ipython: False

generate_report: True
# LLM settings for final report from journal
report:
  model: kimi-k3
  temp: 1.0

experiment:
  num_syn_datasets: 1

debug:
  stage4: False

# agent hyperparams
agent:
  type: parallel
  num_workers: 4
  stages:
    stage1_max_iters: 20
    stage2_max_iters: 12
    stage3_max_iters: 12
    stage4_max_iters: 18
  # how many improvement iterations to run
  steps: 5 # if stage-specific max_iters are not provided, the agent will use this value for all stages
  # whether to instruct the agent to use CV (set to 1 to disable)
  k_fold_validation: 1
  multi_seed_eval:
    num_seeds: 3 # should be the same as num_workers if num_workers < 3. Otherwise, set it to be 3.
  # whether to instruct the agent to generate a prediction function
  expose_prediction: True
  # whether to provide the agent with a preview of the data
  data_preview: True

  # LLM settings for coding
  code:
    model: kimi-k3
    # Every debug iteration rewrites the whole ~1200-line script. At temp 1.0
    # that drifts: blocks that fail to compile (which extract_code discards
    # silently, costing a full retry) and dead-code placeholders such as
    # `x = real_call(...) if False else (None, None)`, which clobbered the model
    # with None. Sampling diversity buys nothing on a rewrite -- the plan is
    # already fixed by the parent node.
    temp: 0.4
    max_tokens: 32768

  # LLM settings for evaluating program output / tracebacks
  feedback:
    model: kimi-k3
    temp: 0.5
    max_tokens: 32768

  vlm_feedback:
    model: local/qwen2.5-vl-32b
    temp: 0.5
    max_tokens: null

  search:
    max_debug_depth: 3
    debug_prob: 0.5
    num_drafts: 3

  # Options for summarizing findings and selecting the best node
  # If not specified, the default behavior will be used.

  summary:
    model: kimi-k3
    temp: 0.3

  select_node:
    model: kimi-k3
    temp: 0.3
